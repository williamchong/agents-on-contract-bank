# Publishes the dashboard that plays back the run recorded on Base Sepolia, recordings/base-sepolia.json, to
# GitHub Pages. The run is recorded once with `pnpm record:base-sepolia`, not on each push, as each run deploys
# a new bank there. See docs/architecture.md#playback.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.13.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The local recording is still made, as a check that every card passes, then the Base Sepolia one replaces it.
      - run: pnpm record
      - run: cp recordings/base-sepolia.json dashboard/public/recording.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm --filter dashboard generate:playback
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
