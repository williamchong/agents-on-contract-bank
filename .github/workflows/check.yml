# Runs `pnpm check` on each push and pull request: the contract tests, the services' and the dashboard's type
# checks, and the presets. The Base Sepolia tests, `pnpm check:base-sepolia`, are left to be run by hand.
name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.13.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
